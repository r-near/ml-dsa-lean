name = "MlDsaVerified"
version = "0.1.0"
defaultTargets = ["Impl", "Spec", "Proofs"]

[[require]]
name = "aeneas"
git = "https://github.com/cryspen/aeneas"
rev = "build-183e4f0"
subDir = "backends/lean"

# Extracted Rust (generated by scripts/extract.py; do not edit by hand).
[[lean_lib]]
name = "Impl"

# Spec and Proofs libs are added here when their first file lands.

# FIPS 204 specification (readable transcription) and refinement proofs.
[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Proofs"

# Executable checks (#guard known-answer tests); not a default target.
[[lean_lib]]
name = "SpecTests"

# ACVP cross-check of the specification: `lake build spec-acvp && .lake/build/bin/spec-acvp`.
[[lean_exe]]
name = "spec-acvp"
root = "SpecTests.ACVP"

# Differential evaluation of the extracted Impl (compiled): `lake build impl-eval && .lake/build/bin/impl-eval <inputs>`.
# Not a default target. See scripts/impl-eval.sh.
[[lean_exe]]
name = "impl-eval"
root = "SpecTests.ImplEval"

# Differential check against VCVio (not a default target): `lake build spec-diff-vcvio`, driven by scripts/diff-vcvio.
[[lean_exe]]
name = "spec-diff-vcvio"
root = "SpecTests.DiffVCVio"

# Wycheproof cross-check of the specification: `lake build spec-wycheproof && .lake/build/bin/spec-wycheproof`.
[[lean_exe]]
name = "spec-wycheproof"
root = "SpecTests.Wycheproof"
