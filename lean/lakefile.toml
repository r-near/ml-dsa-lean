name = "MlDsaVerified"
version = "0.1.0"
defaultTargets = ["Impl", "Spec", "Proofs"]

[[require]]
name = "aeneas"
git = "https://github.com/cryspen/aeneas"
rev = "build-183e4f0"
subDir = "backends/lean"

# Extracted Rust (generated by scripts/extract.py; do not edit by hand).
[[lean_lib]]
name = "Impl"

# Spec and Proofs libs are added here when their first file lands.

# FIPS 204 specification (readable transcription) and refinement proofs.
[[lean_lib]]
name = "Spec"

[[lean_lib]]
name = "Proofs"

# Executable checks (#guard known-answer tests); not a default target.
[[lean_lib]]
name = "SpecTests"

# ACVP cross-check of the specification: `lake build spec-acvp && .lake/build/bin/spec-acvp`.
[[lean_exe]]
name = "spec-acvp"
root = "SpecTests.ACVP"

# Wycheproof cross-check of the specification (not a default target). Generate the data first:
# `python3 -I scripts/gen-lean-wycheproof.py`, then `lake build spec-wycheproof && .lake/build/bin/spec-wycheproof`.
[[lean_exe]]
name = "spec-wycheproof"
root = "SpecTests.Wycheproof"

# Differential evaluation of the extracted Impl (compiled), not a default target: see scripts/impl-eval.sh.
[[lean_exe]]
name = "impl-eval"
root = "SpecTests.ImplEval"
