name: Release-plz

# Automated releases with release-plz (https://release-plz.dev), configured in release-plz.toml. Three jobs:
#   - release-pr  opens or updates a release pull request that bumps the version in Cargo.toml and Cargo.lock and updates
#                 CHANGELOG.md.
#   - lean-gate   waits for the Lean workflow (lean.yml) to finish on the exact commit that was pushed, and fails unless its
#                 `lean-check` job succeeded there (scripts/require-lean-run.sh).
#   - release     needs lean-gate; after the release pull request is merged, publishes the unpublished version to crates.io,
#                 then pushes the v<version> git tag and creates the GitHub release.
#
# NO RELEASE WITHOUT THE PROOFS
#   lean.yml runs on every push to main, started by the same push that starts this workflow, so lean-gate looks for the run
#   with head_sha = github.sha, waits for it (up to 3 hours, about the runtime of a cold Lean build plus queueing) and
#   accepts only the job `lean-check` with the conclusion `success`: a failed, cancelled or skipped job, a run for another
#   commit and no run all fail the release. The gate has its own job, so it needs only `actions: read` and `contents: read`;
#   the job that holds the OIDC and write permissions does not start until it passed. The cost: on every push to main the
#   `release` job also waits for the Lean run (it is a no-op after that unless the push is a merged release pull request),
#   so a push that breaks the proofs also shows a failed release job. A failed gate is retried with "Re-run failed jobs"
#   once the Lean run for that commit is green (rerunning lean.yml itself fixes the run the gate reads).
#
# NO LONG-LIVED REGISTRY TOKEN
#   Publishing uses crates.io trusted publishing (OIDC). The `release` job runs in the GitHub environment `release` and
#   asks rust-lang/crates-io-auth-action for a short-lived crates.io token, which the action revokes when the job ends.
#   The crates.io trusted-publisher entry for this crate names this exact workflow file (release-plz.yml) and the
#   environment `release`; renaming either breaks publishing. There is no CARGO_REGISTRY_TOKEN secret. The `release-pr`
#   job is outside the environment and cannot mint a crates.io token.
#   (Upstream also supports skipping the auth action and giving the job only `id-token: write`; release-plz then does the
#   same exchange itself. This workflow keeps the explicit action so the token step is visible and pinned.)
#
# THE RELEASE PULL REQUEST DOES NOT RUN CI AUTOMATICALLY
#   Both jobs use the repository's GITHUB_TOKEN. GitHub does not start workflows for events caused by GITHUB_TOKEN, so
#   ci.yml (and its required status check `ci-ok`) does not run on the release pull request. A maintainer has to push an
#   empty commit to the release branch, or merge with an administrator bypass of the required check. No personal access
#   token or GitHub App is used on purpose. The release pull request only changes the version string in Cargo.toml and
#   Cargo.lock and CHANGELOG.md; scripts/extract_hash.py normalizes the version, so the extraction digest does not move.
#
# GITHUB SETTINGS THIS WORKFLOW NEEDS (not expressible in the file)
#   - Settings > Actions > General > Workflow permissions: "Allow GitHub Actions to create and approve pull requests".
#   - The environment `release` exists. The crates.io trusted-publisher entry matches this repository, this file name and
#     that environment.
#   - Tag v0.1.0 exists at the commit 0.1.0 was published from, so release-plz has a baseline for the changelog.

on:
  push:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "5"

jobs:
  # Opens or updates the release pull request.
  release-pr:
    name: release-pr
    # Do not run in forks: they have no environment, no crates.io trust and nothing to release.
    if: github.repository == 'r-near/ml-dsa-lean'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the release branch and its commits
      pull-requests: write # create and update the release pull request
    # One run at a time per ref, so two pushes in quick succession cannot race on the release branch. Waiting runs are
    # not cancelled (cancel-in-progress: false), as in the release-plz quickstart.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and the tags: release-plz compares the code since the last release and reads the commit
          # messages for the changelog.
          fetch-depth: 0
          # release-plz authenticates its own pushes with GITHUB_TOKEN (set below), as in its quickstart, so the
          # checkout does not need to leave a credential in .git/config.
          persist-credentials: false

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Run release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fails unless lean.yml succeeded for exactly this commit; see the header. No secrets and no write permission.
  lean-gate:
    name: lean-gate
    if: github.repository == 'r-near/ml-dsa-lean'
    runs-on: ubuntu-latest
    # lean.yml's lean-check has a 120 minute timeout; the gate waits up to 3 hours (LEAN_GATE_MAX_SECS) for the run to show up
    # and finish.
    timeout-minutes: 200
    permissions:
      contents: read # check out scripts/require-lean-run.sh at the pushed commit
      actions: read # list the lean.yml runs of this commit and their jobs
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a successful lean-check job for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/require-lean-run.sh "$REPO" "$SHA"

  # Publishes to crates.io, tags the release commit and creates the GitHub release. With `release_always = false` in
  # release-plz.toml it only publishes when the pushed commit comes from a merged release pull request (found through the
  # GitHub API, hence `pull-requests: read`), so it is a no-op on every other push.
  # Deliberately without a `concurrency` block: GitHub cancels a pending run when a newer one arrives, and a cancelled run
  # could be the one that was due to release. Parallel runs are harmless because only the run for the release pull
  # request's merge commit publishes, and crates.io refuses a second upload of the same version.
  release:
    name: release
    # The proofs must have been checked for this exact commit (see the header).
    needs: lean-gate
    if: github.repository == 'r-near/ml-dsa-lean'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment the crates.io trusted publisher is bound to. Only this job uses it.
    environment: release
    permissions:
      contents: write # push the git tag and create the GitHub release
      pull-requests: read # let release-plz find the release pull request and its commits (upstream's setting)
      id-token: write # request the OIDC token that crates-io-auth-action exchanges for a crates.io token
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz releases from the latest commit of the release pull request, which needs the whole history.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # Exchanges the job's OIDC token for a short-lived crates.io token (trusted publishing). The action revokes the
      # token in its post step when the job finishes.
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Run release-plz release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
