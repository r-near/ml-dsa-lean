name: Lean

# The kernel witnesses (scripts/witness-check.sh). Manual or weekly, on a large runner.
#
# WHERE THE LEAN PROOFS RUN
#   The proof gate (scripts/lean-check.sh), with the extraction tools, the re-extraction compared with lean/Impl and the
#   feature-independence gate, runs in .github/workflows/ci.yml (job `lean`) on every pull request and every push to main,
#   on the free `ubuntu-latest` runner (4 vCPU, 16 GB RAM, about 14 GB free disk before the job removes preinstalled
#   software), and the aggregate job `ci-ok` needs it, so it is a required check. It used to be the `lean-check` job of this
#   file, which needed a large runner that was never configured, so the proofs never ran on GitHub.
#
#   Why it fits the free runner now. Measured in Ubuntu 24.04 containers with `--memory 16g --memory-swap 16g`, 4 pinned
#   cores and `--cpus 4`, each run cold (fresh elan, Rust and Lake directories; only `lake exe cache get` downloads):
#     - Before the split of three witness proofs, three modules did not fit: with `LEAN_NUM_THREADS=1` (one `lean` process at
#       a time, so the per-module resident sizes are clean) Proofs.SkWellFormed needed 35.5 GB, Proofs.Witnesses 33.3 GB and
#       Proofs.SampleS about 19 GB of anonymous memory (21.0 GB cgroup peak). The default and one-thread builds were killed
#       by the out-of-memory killer (Lean exit code 137) in Proofs.SampleS. The whole build needed at least 38.5 GB even one
#       module at a time.
#     - After it (the commits "check the SkWellFormed witnesses one eta-block at a time" and "check the ExpandS witness ... one
#       RejBoundedPoly at a time"; theorem statements unchanged), every module peaks at 10.6 GB or less, and the whole
#       lean-check job passed cold in that container:
#         LEAN_NUM_THREADS=1: 2048 s, 9.1 GB peak.   LEAN_NUM_THREADS=2: 1596 s, 12.7 GB.   Default (up to 5 processes): 1455 s, 13.8 GB.
#       The ci.yml job uses 2. `lake` has no `-j` option; `LEAN_NUM_THREADS` sets the size of the Lean task pool, and with it
#       the number of `lean` processes Lake runs at once.
#     - Disk: Mathlib and the other Lake packages are 7.8 GB, the Lean toolchain 2.8 GB, the nightly Rust toolchain 2.1 GB and
#       the extraction tools 0.7 GB: 13.8 GB before the rest of the build output, against about 14 GB free on `/`. The job
#       deletes preinstalled software it does not use (dotnet, Android, GHC, CodeQL, Boost) and prints `df -h` before and after.
#
# WHAT STILL NEEDS A LARGE RUNNER
#   scripts/witness-check.sh builds Proofs.TopWitnessCorrect and the other `Proofs.TopWitness*` modules, which the default
#   targets do not import, and then the default targets too, for the whole-environment
#   scan. It is documented at about 47 min cold and about 46 GB peak across modules (24 GB for the largest declaration),
#   measured on a many-core machine, so it cannot run on `ubuntu-latest` (it dies with exit code 137, an out-of-memory kill,
#   not a proof failure). It reads its runner label from the repository variable LEAN_HEAVY_RUNNER:
#     - Set it (Settings > Secrets and variables > Actions > Variables) to the label of a large hosted runner with 64 GB of
#       RAM or more (32 GB is not enough). If a run dies with exit code 137, rerun it or pick a runner with more memory.
#     - Unset, the weekly run is skipped; a manual dispatch falls back to `ubuntu-latest`, where the job fails with exit code 137.
#   Every run is a cold build: nothing is cached between runs.
#
# TRIGGERS
#   Only a manual dispatch and a weekly schedule. There is deliberately no pull_request trigger (a pull request must not
#   spend large-runner minutes or run its code there) and no push trigger. The witnesses are not a required check; they are run
#   by hand before a release (docs/reproduce.md, section 2.3). The workflow uses no secrets and a read-only token, and checks
#   out the default ref of the event only.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:17 UTC: catches toolchain and dependency drift without any push.
    - cron: "17 3 * * 0"

permissions:
  contents: read

# One heavy run at a time; a new run waits instead of cancelling a long one.
concurrency:
  group: lean-heavy
  cancel-in-progress: false

jobs:
  witness-check:
    name: witness-check
    # This job needs about 46 GB of memory and a large runner (WarpBuild or similar, 16 vCPU / 64 GB) to pass. On a
    # standard runner it is killed with exit code 137, which is an out-of-memory kill, not a proof failure.
    runs-on: ${{ vars.LEAN_HEAVY_RUNNER || 'ubuntu-latest' }}
    if: ${{ vars.LEAN_HEAVY_RUNNER != '' || github.event_name == 'workflow_dispatch' }}
    # About 47 min cold. The script's own `lake build` timeout is 10000 s (167 min).
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # Builds Proofs.TopWitnessCorrect (not imported by the default roots), then the axiom gate over
      # lean/witness-theorems.txt and the no-declarations scan with every module built.
      - name: scripts/witness-check.sh
        run: scripts/witness-check.sh
