name: Lean

# The Lean proof gate (scripts/lean-check.sh) and the kernel witnesses (scripts/witness-check.sh).
#
# THESE JOBS NEED A LARGE RUNNER
#   Neither job fits a standard `ubuntu-latest` runner (4 vCPU, 16 GB RAM, 14 GB disk). Measured for this workflow, cold
#   builds of scripts/lean-check.sh in containers with a hard memory limit (the partial build output was already 7.8 GB plus
#   2.8 GB of toolchain, so the disk is also tight):
#     - 16 GB, 4 CPUs: killed by the out-of-memory killer (Lean exit code 137) in Proofs.SampleS, about 6 minutes in.
#     - 40 GB, 8 CPUs: also killed (exit code 137), in Proofs.SkWellFormed, after about 34 minutes (Proofs.Witnesses alone
#       took 28 minutes). So lean-check's peak is above 40 GB at 8 CPUs, and its true peak is not recorded anywhere.
#   `lake` builds modules in parallel, so the peak grows with the core count and the memory needed depends on the runner.
#   A Docker CPU limit (`--cpus`) caps CPU time but not the CPU count the build sees, so the capped runs may have built
#   more modules at once than an 8-vCPU runner would; the true peak on an 8-vCPU runner is not measured.
#   scripts/witness-check.sh is documented at about 47 min cold and about 46 GB peak (24 GB for the largest declaration) in
#   its header, measured on a many-core machine.
#   So both jobs read their runner label from the repository variable LEAN_HEAVY_RUNNER:
#     - Set it (Settings > Secrets and variables > Actions > Variables) to the label of a large hosted runner, for example
#       a WarpBuild or other label with 64 GB of RAM or more. 32 GB is not enough for witness-check (about 46 GB), and
#       lean-check was above 40 GB at 8 CPUs. If a run dies with exit code 137, rerun it or pick a runner with more memory.
#     - Unset, the weekly run is skipped; a manual dispatch falls back to `ubuntu-latest`, where the jobs fail with exit
#       code 137 (out of memory).
#   Every run is a cold build: nothing is cached between runs. Expect the lean-check job to take about an hour on a
#   16 vCPU / 64 GB runner (an estimate, not a measurement: at 8 CPUs the build was still going when it was killed after 34
#   minutes), plus about 10 minutes before it for the extraction tools; its timeout is 120 minutes.
#
# TRIGGERS
#   - pull_request: lean-check runs when the pull request touches an input of the proofs (src/, lean/, scripts/, Cargo.toml,
#     Cargo.lock, README.md, rust-toolchain.toml, .cargo/, the workflows and actions; the `changes` job decides). A pull
#     request that touches none of them skips the heavy job and passes `lean-ok`. A pull request from a FORK is never run on
#     the large runner (it would execute untrusted build code there); if it touches an input of the proofs, `lean-ok` FAILS
#     until a maintainer pushes the branch to this repository, so a green `lean-ok` always means the proofs were checked.
#     New commits cancel the run of the pull request they replace.
#   - push to main: always runs, for every commit, never cancelled by a later push. The release workflow
#     (release-plz.yml, scripts/require-lean-run.sh) refuses to publish a commit that has no successful `lean-check` job here.
#   - workflow_dispatch and a weekly schedule: as before; the schedule is skipped until a large runner is configured.
#   witness-check (the kernel witnesses, about 47 minutes and 46 GB) runs only on the dispatch and the schedule.
#
# BRANCH PROTECTION
#   Require `lean-ok`, not `lean-check`: `lean-ok` always reports, and it fails when the heavy job failed, was cancelled or
#   was skipped although it had to run. A skipped job counts as passing for a required check, which is why `lean-check` alone
#   cannot be the required one.
#
# WITHOUT A LARGE RUNNER
#   A pull request or push with LEAN_HEAVY_RUNNER unset fails at once (the first step of lean-check says why) instead of
#   skipping: a skipped proof check must not look like a passed one. The weekly schedule still skips quietly.
#
# The workflow uses no secrets and a read-only token, and checks out only the commit of the event.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:17 UTC: catches toolchain and dependency drift without any push.
    - cron: "17 3 * * 0"

permissions:
  contents: read

# A pull request has one run at a time and a new commit replaces it; a push to main has its own group per commit, so a later
# push never cancels the run a release may be waiting for; a dispatch or the schedule waits instead of cancelling a long run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('lean-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('lean-push-{0}', github.sha) || 'lean-heavy') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap and always run: decides whether a pull request touches an input of the proofs. Everything else (push, dispatch,
  # schedule) always counts as relevant.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # For a pull request this is the merge commit of the base and the head; depth 2 includes its first parent, the base.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether the proofs are affected
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inputs of the proofs: what lean-check.sh, the extraction and the feature-independence gate read, and the workflows.
          pattern='^(src/|lean/|scripts/|\.cargo/|\.github/workflows/|\.github/actions/|Cargo\.toml$|Cargo\.lock$|README\.md$|rust-toolchain)'
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "$files"
          if echo "$files" | grep -Eq "$pattern"; then
            if [ "$FORK" = true ]; then
              echo "run=fork" >> "$GITHUB_OUTPUT"
              echo "::warning::this pull request is from a fork and touches an input of the proofs; the Lean check does not run on forks"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no input of the proofs changed; the heavy Lean job is skipped"
          fi

  lean-check:
    name: lean-check
    needs: changes
    # Needs a large runner, see the header. Peak memory is unrecorded; it exceeded 40 GB at 8 CPUs.
    runs-on: ${{ vars.LEAN_HEAVY_RUNNER || 'ubuntu-latest' }}
    # Skipped when the pull request does not touch the proofs, on a fork pull request, and on the weekly schedule until a large
    # runner is configured; a push, a pull request and a dispatch without one fail in the first step instead.
    if: ${{ needs.changes.outputs.run == 'true' && (vars.LEAN_HEAVY_RUNNER != '' || github.event_name != 'schedule') }}
    timeout-minutes: 120
    steps:
      - name: Require a large runner for a pull request or a push
        if: ${{ vars.LEAN_HEAVY_RUNNER == '' && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        run: |
          echo "::error::LEAN_HEAVY_RUNNER is not set (Settings > Secrets and variables > Actions > Variables). The Lean check needs a large runner and a skipped proof check must not pass."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # Re-runs the extraction (Charon + Aeneas on src/) into a new, empty directory and fails unless every file there is
      # byte-identical to the committed lean/Impl and there are no extra files in either, so the proofs below are about the
      # extraction of the committed Rust. The tools are the pinned, checksum-verified ones from scripts/setup-tools.sh.
      # Needs rustup, curl, zstd. Extracting into the checkout instead would let a symlinked lean/Impl or an extra file
      # hide the difference; the fast check below rejects symlinks anywhere in lean/Impl.
      - name: Install the extraction tools
        run: |
          if ! command -v zstd >/dev/null; then sudo apt-get update && sudo apt-get install -y zstd; fi
          scripts/setup-tools.sh

      - name: Re-extract into an empty directory and compare with lean/Impl
        run: |
          set -euo pipefail
          python3 -I scripts/extract_hash.py check
          out="$RUNNER_TEMP/extracted-impl"
          rm -rf "$out"
          python3 scripts/extract.py --out "$out"
          if ! diff -r lean/Impl "$out"; then
            echo "::error::lean/Impl is not the extraction of src/: run scripts/extract.py and commit lean/Impl"
            exit 1
          fi
          echo "lean/Impl is byte-identical to a fresh extraction of src/ ($(find "$out" -type f | wc -l) files)"

      # Builds the default targets (Impl, Spec, Proofs), fails on any `error:` or `sorry` in the log, then runs the axiom
      # gate over lean/headline-theorems.txt and the whole-environment scan for axiom, opaque, sorry, admit, native_decide,
      # implemented_by and extern (scripts/check-no-decls.sh, with its injected-declaration self-test), the reachable-declaration count
      # (scripts/reachable-defs.sh), the cfg inventory of src/, and the feature-independence gate (a second extraction of src/
      # under +avx,+avx2 target features, compared with lean/Impl; scripts/check-feature-independence.sh, which uses the tools
      # installed above). Prints "LEAN CHECK OK"
      # only if all pass. The script has its own 3000 s `lake build` timeout.
      - name: scripts/lean-check.sh
        run: scripts/lean-check.sh

  # The one check to require: it reports for every pull request and push, and fails unless the proofs were checked when they had to be.
  lean-ok:
    name: lean-ok
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    needs: [changes, lean-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless the Lean check passed or was not needed
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          LEAN: ${{ needs.lean-check.result }}
        run: |
          echo "changes: $CHANGES (run=$RUN), lean-check: $LEAN"
          if [ "$CHANGES" != success ]; then echo "::error::the changes job did not succeed"; exit 1; fi
          case "$RUN" in
            false) echo "no input of the proofs changed" ;;
            fork) echo "::error::fork pull request that touches an input of the proofs: the Lean check does not run on forks; a maintainer must push the branch to this repository"; exit 1 ;;
            true) [ "$LEAN" = success ] || { echo "::error::lean-check did not succeed ($LEAN)"; exit 1; } ;;
            *) echo "::error::unexpected decision: $RUN"; exit 1 ;;
          esac

  witness-check:
    name: witness-check
    # This job needs about 46 GB of memory and a large runner (WarpBuild or similar, 16 vCPU / 64 GB) to pass. On a
    # standard runner it is killed with exit code 137, which is an out-of-memory kill, not a proof failure.
    runs-on: ${{ vars.LEAN_HEAVY_RUNNER || 'ubuntu-latest' }}
    # Not on pull requests or pushes (about 47 minutes and 46 GB each time); the dispatch and the schedule only.
    if: ${{ (github.event_name == 'schedule' && vars.LEAN_HEAVY_RUNNER != '') || github.event_name == 'workflow_dispatch' }}
    # About 47 min cold. The script's own `lake build` timeout is 10000 s (167 min).
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # Builds Proofs.TopWitnessCorrect (not imported by the default roots), then the axiom gate over
      # lean/witness-theorems.txt and the no-declarations scan with every module built.
      - name: scripts/witness-check.sh
        run: scripts/witness-check.sh
