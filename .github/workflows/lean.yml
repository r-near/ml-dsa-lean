name: Lean

# The kernel witnesses (scripts/witness-check.sh). Manual or weekly, on the free ubuntu-latest runner.
#
# WHERE THE LEAN PROOFS RUN
#   The proof gate (scripts/lean-check.sh), with the extraction tools, the re-extraction compared with lean/Impl and the
#   feature-independence gate, runs in .github/workflows/ci.yml (job `lean`) on every pull request and every push to main,
#   on the free `ubuntu-latest` runner (4 vCPU, 16 GB RAM), and the aggregate job `ci-ok` needs it, so it is a required check. It used to be the `lean-check` job of this
#   file, which needed a large runner that was never configured, so the proofs never ran on GitHub.
#
#   Why it fits the free runner now. Measured in Ubuntu 24.04 containers with `--memory 16g --memory-swap 16g`, 4 pinned
#   cores and `--cpus 4`, each run cold (fresh elan, Rust and Lake directories; only `lake exe cache get` downloads):
#     - Before the split of three witness proofs, three modules did not fit: with `LEAN_NUM_THREADS=1` (one `lean` process at
#       a time, so the per-module resident sizes are clean) Proofs.SkWellFormed needed 35.5 GB, Proofs.Witnesses 33.3 GB and
#       Proofs.SampleS about 19 GB of anonymous memory (21.0 GB cgroup peak). The default and one-thread builds were killed
#       by the out-of-memory killer (Lean exit code 137) in Proofs.SampleS. The whole build needed at least 38.5 GB even one
#       module at a time.
#     - After it (the commits "check the SkWellFormed witnesses one eta-block at a time" and "check the ExpandS witness ... one
#       RejBoundedPoly at a time"; theorem statements unchanged), every module peaks at 10.6 GB or less, and the whole
#       lean-check job passed cold in that container:
#         LEAN_NUM_THREADS=1: 2048 s, 9.1 GB peak.   LEAN_NUM_THREADS=2: 1596 s, 12.7 GB.   Default (up to 5 processes): 1455 s, 13.8 GB.
#       The ci.yml job uses 2. `lake` has no `-j` option; `LEAN_NUM_THREADS` sets the size of the Lean task pool, and with it
#       the number of `lean` processes Lake runs at once.
#     - Disk: Mathlib and the other Lake packages are 7.8 GB, the Lean toolchain 2.8 GB, the nightly Rust toolchain 2.1 GB and
#       the extraction tools 0.7 GB: 13.8 GB before the rest of the build output, against the documented 14 GB free on `/`. The
#       job deletes preinstalled software it does not use (dotnet, Android, GHC, CodeQL, Boost) and prints `df -h` before and
#       after. On the first GitHub run (2026-11-11, this public repository) `/` was 145 GB with 88 GB free before the cleanup,
#       106 GB after and 93 GB at the end, so the cleanup was margin, not a need.
#     - The first GitHub run (ubuntu-latest, `LEAN_NUM_THREADS=2`): the `lean` job took 36 min 47 s (the `lean-check.sh` step
#       33 min 44 s; setup, tools and re-extraction about 3 min; the cleanup 87 s). Sampled every 30 s: at most 12.5 GB used,
#       at least 3.4 GB available, `lean/.lake` 8.0 GB at the end.
#
# THE KERNEL WITNESSES ALSO FIT THE FREE RUNNER (this workflow)
#   scripts/witness-check.sh builds Proofs.TopWitnessCorrect and the other `Proofs.TopWitness*` modules, which the default
#   targets do not import, checks the 146 names of lean/witness-theorems.txt for standard axioms, then builds the default
#   targets and runs the whole-environment scan. It used to need about 46 GB (about 24 GB for the largest declaration), so it
#   needed a large runner that was never configured. The heavy kernel evaluations are now checked piece by piece
#   (scripts/gen-witness-stages.py, Proofs/TopWitnessPieces.lean, Proofs/TopWitnessMid.lean): a forward or inverse NTT as
#   chained groups of layers, a long SHAKE absorption as chained groups of blocks, each matrix-vector product as one check
#   per row, and the sampler and signing witnesses as one check per call, always against a literal intermediate value that
#   the kernel re-derives. No theorem statement changed.
#   Measured in the container described above (16 GB cap, swap off, 4 pinned cores), cold (fresh elan, Lake and Mathlib
#   directories; only `lake exe cache get` downloads), on a build machine that was busy with other jobs:
#     LEAN_NUM_THREADS=1: 8195 s (2 h 17 min), 10.2 GB of anonymous memory at most. The largest `lean` process (Proofs.TopWitnessKA)
#                         is 13.5 GB resident, which includes about 3.5 GB of memory-mapped, reclaimable imports.
#     LEAN_NUM_THREADS=2: 7187 s (2 h 00 min), 12.9 GB of anonymous memory at most (two processes, in Proofs.Witnesses).
#   Both runs ended with `WITNESS CHECK OK` and no out-of-memory kill; the cgroup counter sat at the 16 GB cap because the page
#   cache fills it, and the kernel reclaims that (about 2600 reclaim events, `oom_kill 0`).
#   The modules form an import chain (KA < KS < Misc < Nf1 < Nf2 < Ni < Nc1 < Nc2 < Nc3), so at most one heavy module is
#   built at a time and a second thread buys 12 %. The job uses 1, which leaves about 4 GB for the runner itself.
#   Before the split the largest module, Proofs.TopWitnessMisc, was 45.8 GB resident (43.4 GB anonymous) in a 64 GB container,
#   and a 40 GB container killed it (exit code 137); the next ones were 27 GB (Ni, Nc3) and 24 GB (Sign).
#   Every run is a cold build: nothing is cached between runs. Public repositories pay nothing for `ubuntu-latest`.
#   Optional override: set the repository variable LEAN_WITNESS_RUNNER (Settings > Secrets and variables > Actions >
#   Variables) to the label of another runner, for example a larger hosted one, and the job runs there instead.
#
# TRIGGERS
#   Only a manual dispatch and a weekly schedule. The job is deliberately NOT part of `ci-ok` and has no pull_request or push
#   trigger: in the same container it takes 4.0 times as long as lean-check.sh (8195 s against 2048 s at one thread). Scaled by
#   the 1.27 that the first GitHub run of the `lean` job showed (2024 s against 1596 s), that is about 2.9 h on GitHub against 37
#   min for the `lean` job of ci.yml, and a pull request would wait for it
#   (docs/assurance.md, section 1.7, says what the witnesses add). The weekly run catches toolchain and dependency drift
#   without any push; run it by hand (Actions > Lean > Run workflow) after a change to lean/Proofs/TopWitness*.lean,
#   scripts/gen-witness-stages.py or lean/SpecTests/WitnessMidGen.lean, and before a release (docs/reproduce.md, section 2.3).
#   The workflow uses no secrets and a read-only token, and checks out the default ref of the event only.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:17 UTC: catches toolchain and dependency drift without any push.
    - cron: "17 3 * * 0"

permissions:
  contents: read

# One witness run at a time; a new run waits instead of cancelling a long one.
concurrency:
  group: lean-witness
  cancel-in-progress: false

jobs:
  witness-check:
    name: witness-check
    runs-on: ${{ vars.LEAN_WITNESS_RUNNER || 'ubuntu-latest' }}
    # Cold build measured at 7187 to 8195 s (see LEAN_NUM_THREADS); setup adds about 3 min. 300 min leaves a wide margin under
    # the 6 h hard limit and still ends a hung job in good time. The script bounds each `lake build` itself (18000 s).
    timeout-minutes: 300
    env:
      # Parallelism of the Lean task pool, and with it the number of `lean` processes Lake runs at once. Measured in the
      # 16 GB / 4 core container: 1 gives 8195 s and 10.2 GB of anonymous memory, 2 gives 7187 s and 12.9 GB. The heavy
      # modules form an import chain, so 2 helps little; this job uses 1. If a run dies with exit code 137 (out of memory),
      # it is a memory problem, not a proof failure: rerun it.
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same step as the `lean` job of ci.yml: Mathlib and the other Lake packages are 7.8 GB and the Lean toolchain 2.8 GB
      # (at the end of the measured run `lean/.lake` was 8.2 GB and the toolchain 2.8 GB), against the documented 14 GB free on `/`. Margin, not a need.
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          echo "after:"; df -h /
          free -g

      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # Builds Proofs.TopWitnessCorrect (not imported by the default roots), then the axiom gate over
      # lean/witness-theorems.txt and the no-declarations scan with every module built. Prints "WITNESS CHECK OK: " only if
      # every step passes.
      - name: scripts/witness-check.sh
        run: |
          set -euo pipefail
          # Log memory every 30 s so a kill by the out-of-memory killer shows how close the run was.
          ( while sleep 30; do echo "mem: $(free -m | awk '/^Mem:/ {print "used " $3 " MB, available " $7 " MB"}') | disk: $(df -h / | awk 'NR==2 {print $4 " free"}')"; done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          scripts/witness-check.sh

      - name: Report disk and memory at the end
        if: always()
        run: |
          df -h /
          free -g
          du -sh lean/.lake "$HOME/.elan" 2>/dev/null || true
