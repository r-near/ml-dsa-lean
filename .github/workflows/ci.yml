name: CI

# Light Rust checks on free GitHub-hosted runners. Every job calls `scripts/ci.sh --only <step>`, so the commands live in
# one place and a contributor can run the same step locally.
#
# Besides the Rust steps there are two cheap repository checks (repo-checks): that src/ and lean/Impl still match the
# extraction report, and that the axiom gate fails on a missing or empty list. A macOS arm64 job (macos-arm64) runs the
# default and the zeroize suites on Apple Silicon, which the Linux jobs do not cover.
#
# The Lean proofs (job `lean`) run on every pull request and every push to main, on the free ubuntu-latest runner, and
# ci-ok waits for them, so they are a required check through ci-ok. Since the three witness proofs were split into small
# kernel checks (Proofs.SampleS, Proofs.SkWellFormed, Proofs.Witnesses), no module peaks above 10.6 GB.
#
# Heavy checks are elsewhere:
#   - The kernel witnesses (scripts/witness-check.sh, about 46 GB): .github/workflows/lean.yml, manual or weekly, on the
#     large runner named by the repository variable LEAN_HEAVY_RUNNER.
#   - The BINSEC constant-time harness (checkct/): manual, far too heavy for CI.
#
# This workflow uses no secrets and a read-only token, so it is safe for pull requests from forks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_MAX_RETRIES: "5"
  # Same nightly the extraction pipeline pins (scripts/setup-tools.sh); the fuzz steps use it through FUZZ_TOOLCHAIN.
  FUZZ_NIGHTLY: nightly-2026-08-18

jobs:
  rust:
    name: ${{ matrix.step }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The steps of scripts/ci.sh that are self-contained on a stock runner: ci.sh installs the 1.86.0 and 1.95.0
        # toolchains with rustup, and adds the thumbv7em and wasm32 targets on demand (E0463 retry). aws-lc-sys (the
        # differential-test oracle) builds with the runner's cmake and C compiler.
        step:
          - test-default
          - test-zeroize
          - test-zeroize-release
          - test-avx2
          - avx2-inlining
          - thumbv7em
          - msrv-1.86
          - nearcore-build
          - nearcore-test
          - nearcore-test-avx2
          - nearcore-test-zeroize
          - wasm32
          - wasm32-zeroize
          - diff-awslc
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.step }}
          # Only the default branch writes the cache, so a pull request cannot plant entries other runs restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run scripts/ci.sh --only ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
        # --strict: a SKIP (missing tool or toolchain) fails the job instead of passing silently.
        run: bash scripts/ci.sh --strict --only "$STEP"

  # No Rust and no Lean: scripts/extract_hash.py, the axiom-gate self-test, the text half of the no-declarations scan, the cfg inventory of src/, the README theorem counts and the self-test of the ci.sh/lean-check.sh feature-independence flag (see the header of scripts/ci.sh).
  repo-checks:
    name: ${{ matrix.step }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        step:
          - extract-hash
          - axiom-gate-selftest
          - no-decls-text
          - cfg-inventory
          - readme-counts
          - ci-selftest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run scripts/ci.sh --only ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
        run: bash scripts/ci.sh --strict --only "$STEP"

  # Apple Silicon (macos-15 is arm64; the Intel image is macos-15-intel). The Linux jobs run on x86_64 only. The release
  # zeroize suite, with the stack-residue scans, is the one that differs between targets.
  macos-arm64:
    name: macos-arm64 ${{ matrix.step }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        step:
          - test-default
          - test-zeroize-release
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-arm64-${{ matrix.step }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Show the target
        run: uname -m && rustc -vV

      - name: Run scripts/ci.sh --only ${{ matrix.step }}
        env:
          STEP: ${{ matrix.step }}
        run: bash scripts/ci.sh --strict --only "$STEP"

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prebuilt cargo-deny, so ci.sh does not compile it with `cargo install`.
      - name: Install cargo-deny
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny

      - name: Run scripts/ci.sh --only deny
        # Fetches the RustSec advisory database (a public git repository); sends nothing about this project.
        run: bash scripts/ci.sh --strict --only deny

  fuzz:
    name: fuzz-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One entry per file in fuzz/fuzz_targets; ci.sh rejects a step name it does not know.
        target: [decode_roundtrip, sign_diff, verify_diff]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the nightly toolchain
        run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-fuzz

      - name: Cache cargo registry and fuzz build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            fuzz -> target
          key: fuzz-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run scripts/ci.sh --only fuzz-${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_TOOLCHAIN: ${{ env.FUZZ_NIGHTLY }}
        # 60 s per target is a smoke run (ci.sh default), not a fuzzing campaign.
        run: bash scripts/ci.sh --strict --fuzz-secs 60 --only "fuzz-$TARGET"

  # The Lean proof gate on the free runner (4 vCPU, 16 GB RAM, about 14 GB free disk before the cleanup below). It runs the
  # same steps the lean-check job of lean.yml used to run, in order: scripts/setup-tools.sh, the fast check, a re-extraction
  # of src/ into an empty directory compared with lean/Impl, then scripts/lean-check.sh (the build of the default targets, the
  # axiom gates over the headline, keccak4 and fast-verify lists, the no-declarations scan, the reachable-declaration count,
  # the cfg inventory, the README counts and the feature-independence gate). Every run is a cold build.
  #
  # It runs on every pull request and every push to main, with no path filter, so ci-ok can require it without a skip rule.
  # It uses no secrets, so it is also safe for pull requests from forks. The workflow-level concurrency group above cancels
  # a superseded pull request run and never cancels a push to main.
  lean:
    name: lean
    runs-on: ubuntu-latest
    # Cold build measured at 1455 to 2048 s (see LEAN_NUM_THREADS); setup adds about 5 min. 170 min leaves a wide margin
    # under the 6 h hard limit and still ends a hung job in good time. lean-check.sh bounds `lake build` itself (7200 s).
    timeout-minutes: 170
    permissions:
      contents: read # check out the repository (the job uses no secrets and writes nothing)
    env:
      # Parallelism of the Lean task pool, and with it the number of `lean` processes Lake runs at once. Measured on this
      # runner's shape (container with --memory 16g --memory-swap 16g, 4 pinned cores): default 1455 s and 13.8 GB peak,
      # 2 gives 1596 s and 12.7 GB, 1 gives 2048 s and 9.1 GB. The default leaves too little room on a runner that also runs
      # the OS, so this job uses 2. If a run dies with exit code 137 (out of memory), set it to 1 (about 9 GB, 8 min slower).
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Lean toolchain, Mathlib and the other Lake packages are 7.8 GB, the Lean toolchain 2.8 GB, the nightly Rust
      # toolchain 2.1 GB and the extraction tools 0.7 GB: 13.8 GB before the build output, against about 14 GB free on `/`.
      # Delete preinstalled software this job does not use (the usual dependency-free way to make room).
      - name: Free disk space
        run: |
          set -euo pipefail
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          echo "after:"; df -h /
          free -g

      - name: Set up Lean
        uses: ./.github/actions/setup-lean

      # Pinned, checksum-verified Charon, Aeneas and cargo-hax (scripts/setup-tools.sh; needs rustup, curl, zstd).
      - name: Install the extraction tools
        run: |
          if ! command -v zstd >/dev/null; then sudo apt-get update && sudo apt-get install -y zstd; fi
          scripts/setup-tools.sh

      # Re-runs the extraction (Charon + Aeneas on src/) into a new, empty directory and fails unless every file there is
      # byte-identical to the committed lean/Impl and there are no extra files in either, so the proofs below are about the
      # extraction of the committed Rust. This is the check that a coordinated edit of lean/Impl and the extraction report
      # does not pass. Extracting into the checkout instead would let a symlinked lean/Impl or an extra file hide the
      # difference; the fast check rejects symlinks anywhere in lean/Impl.
      - name: Fast check, then re-extract into an empty directory and compare with lean/Impl
        run: |
          set -euo pipefail
          python3 -I scripts/extract_hash.py check
          out="$RUNNER_TEMP/extracted-impl"
          rm -rf "$out"
          python3 scripts/extract.py --out "$out"
          if ! diff -r lean/Impl "$out"; then
            echo "::error::lean/Impl is not the extraction of src/: run scripts/extract.py and commit lean/Impl"
            exit 1
          fi
          echo "lean/Impl is byte-identical to a fresh extraction of src/ ($(find "$out" -type f | wc -l) files)"

      # Prints "LEAN CHECK OK: " only if the build and every gate pass (see scripts/lean-check.sh).
      - name: scripts/lean-check.sh
        run: |
          set -euo pipefail
          # Log memory every 30 s so a kill by the out-of-memory killer shows how close the run was.
          ( while sleep 30; do echo "mem: $(free -m | awk '/^Mem:/ {print "used " $3 " MB, available " $7 " MB"}') | disk: $(df -h / | awk 'NR==2 {print $4 " free"}')"; done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          scripts/lean-check.sh

      - name: Report disk and memory at the end
        if: always()
        run: |
          df -h /
          free -g
          du -sh lean/.lake "$HOME/.elan" "$HOME/hax-tools" 2>/dev/null || true

  # One required status check for branch protection: it fails if any job above failed, was cancelled or was skipped. `lean`
  # is in the list, so a pull request that breaks a proof (or the extraction check) cannot merge.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [rust, repo-checks, macos-arm64, deny, fuzz, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needed job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then exit 1; fi
