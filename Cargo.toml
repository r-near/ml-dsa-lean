[package]
name = "ml-dsa-lean"
version = "0.1.0"
edition = "2024"
# Safe `#[target_feature]` functions (the optional `avx2` feature) need 1.86.
rust-version = "1.86"
license = "MIT OR Apache-2.0"
description = "Formally verified ML-DSA (FIPS 204) in Rust: proved in Lean to never panic and to match the standard"
repository = "https://github.com/r-near/ml-dsa-lean"
readme = "README.md"
keywords = ["ml-dsa", "dilithium", "post-quantum", "signature", "fips204"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]
# Only the library source and the legal/readme files are published. The Lean proofs, the constant-time checks, the
# differential tests, fuzzers, benchmarks and docs live in the repository; they need repo-only files or dev-dependencies
# that `cargo package` strips (the oracle crates), so the tests are not shipped either.
include = ["/src/**/*.rs", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
# Optional: wipes the secret material the library handles. Dropping a prepared signing key wipes it; keygen, sign and the
# key constructors wipe the decoded or derived secrets in their locals (K, s1, s2, t0, rho', rho'', the decoded key, and for Sign the mask y and the values derived from it in each attempt) and
# the SHAKE states that absorbed a secret, before they return. The `api` module docs list what is not covered (moves of
# the returned objects, the accepted signature, t0 and one K in KeyGen). Not part of the Lean proof: the
# extracted code is the code without this feature.
zeroize = { version = "1", default-features = false, optional = true }

[features]
default = []
zeroize = ["dep:zeroize"]
# Optional, x86_64 only (not SGX): runtime AVX2 dispatch. There are no intrinsics: both users compile proved plain Rust
# a second time inside `#[target_feature(enable = "avx2")]` functions, and a cached CPUID check picks a compilation.
# (1) The NTT bodies (src/ntt.rs, "Dispatch"): the proved source body is compiled twice, once for the build's target
# features and once with AVX2; the choice is a plain `if has_avx2()` that the Lean extraction does not see (it extracts the
# portable body). (2) Verify and the prepared-key constructor (src/fast_verify.rs, src/fast_verify/dispatch.rs): on a CPU
# with AVX2 they run the 4-way body (a loop over four Keccak states that LLVM vectorizes), otherwise the scalar code. That
# choice is made by `fast_verify::*_with(Option<cpu::Avx2>, ..)`, which is extracted and proved equal to the scalar function
# for every token value (lean/Proofs/Dispatch.lean). What is outside the Lean proof is the CPU check that makes the token
# (src/cpu.rs), the `unsafe` calls of the `#[target_feature]` functions (three in src/fast_verify/dispatch.rs, five in
# src/ntt.rs, plus the CPUID code in src/cpu.rs and, for tests only, keccak4.rs and hooks.rs), the NTT
# `has_avx2` branch, and the compiler. BINSEC cannot lift the AVX2 copies (docs/object-code-assurance.md section 3.5). Without the
# feature, and on other targets, the crate forbids `unsafe` and the verify functions are the extracted text
# (docs/assurance.md, "Round 10"). Alternative without `unsafe`: build with
# `-C target-cpu=x86-64-v3` (verify timings are within a few percent of the feature's, in either direction depending on
# the rustc version, docs/assurance.md section 5; the binary then requires AVX2, and BINSEC cannot lift its vector code
# either).
avx2 = []
# Tests and fuzzing only; exposes unproved internals.
# Makes every module public (keygen::keygen_internal, sign::sign_internal and verify::verify_internal
# panic on wrong-length slices or a Params inconsistent with K/L). The default public surface is `api` only.
# Enabled for this crate's own tests and examples by the self dev-dependency below.
internals = []

[dev-dependencies]
# Self dev-dependency: turns on `internals` for tests, examples and benches (not for downstream users).
ml-dsa-lean = { path = ".", features = ["internals"] }
# Differential oracle: upstream RustCrypto master a3690c4, deprecated expanded-key API for skEncode bytes.
ml-dsa = { git = "https://github.com/RustCrypto/signatures", rev = "a3690c4a0bd861fcf2bde0e38b3609e86c3fe89e", default-features = false, features = ["alloc"] }

# Differential oracle for the verify verdict: aws-lc-rs at the exact version nearcore ships (its Cargo.lock resolves
# aws-lc-sys 0.46.0), default features as in nearcore. Tests only (tests/awslc_diff.rs).
aws-lc-rs = "=1.18.2"

flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false

[workspace]
