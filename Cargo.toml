[package]
name = "ml-dsa-verified"
version = "0.0.0"
edition = "2024"
publish = false
description = "Proof-first ML-DSA (FIPS 204): one Rust function per algorithm, plain arrays and loops, extracted to Lean"

[dependencies]
# Optional: wipes secret temporaries at the end of sign_internal/keygen_internal. Not part of the Lean proof.
zeroize = { version = "1", default-features = false, optional = true }

[features]
default = []
zeroize = ["dep:zeroize"]
# test/fuzz/checkct only; exposes unproved internals.
# Makes every module public (keygen::keygen_internal, sign::sign_internal and verify::verify_internal
# panic on wrong-length slices or a Params inconsistent with K/L). The default public surface is `api` only.
# Enabled for this crate's own tests and examples by the self dev-dependency below.
internals = []

[dev-dependencies]
# Self dev-dependency: turns on `internals` for tests, examples and benches (not for downstream users).
ml-dsa-verified = { path = ".", features = ["internals"] }
# Differential oracle: upstream RustCrypto master a3690c4, deprecated expanded-key API for skEncode bytes.
ml-dsa = { git = "https://github.com/RustCrypto/signatures", rev = "a3690c4a0bd861fcf2bde0e38b3609e86c3fe89e", default-features = false, features = ["alloc"] }

flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false

[workspace]
